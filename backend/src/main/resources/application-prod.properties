# Activated with SPRING_PROFILES_ACTIVE=prod. Every value below is required with no
# fallback on purpose: the app fails fast at startup instead of silently running with
# a dev secret or an in-process database in production.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway (db/migration/*.sql), not Hibernate — "validate" makes
# the app fail fast on startup if the entities and the real schema disagree instead
# of silently altering tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# The Neon "production" branch already had its schema created by Hibernate
# ddl-auto=update before Flyway was introduced. baseline-on-migrate lets Flyway
# adopt that existing, non-empty schema as if V1 had already run, instead of
# failing because the tables already exist. Against a genuinely empty database
# (a fresh branch, a new environment) it has no effect — V1 just runs normally.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema created by Hibernate before Flyway was introduced

spring.h2.console.enabled=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.ratelimit.auth-per-minute=${APP_RATELIMIT_AUTH_PER_MINUTE:20}

# JSON logs to stdout (ECS field names) so any log collector (Loki, CloudWatch,
# Datadog, etc.) can parse them without custom parsing rules. requestId/user
# come from RequestLoggingFilter/JwtAuthFilter via MDC and are included
# automatically as extra fields on every log line within a request.
logging.structured.format.console=ecs

