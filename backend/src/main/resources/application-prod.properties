# Activated with SPRING_PROFILES_ACTIVE=prod. Every value below is required with no
# fallback on purpose: the app fails fast at startup instead of silently running with
# a dev secret or an in-process database in production.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# "validate" on purpose: schema changes in prod should go through a migration tool
# (e.g. Flyway), not Hibernate auto-DDL. Run once against a fresh database with
# spring.jpa.hibernate.ddl-auto=update, then switch back to validate.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.ratelimit.auth-per-minute=${APP_RATELIMIT_AUTH_PER_MINUTE:20}
