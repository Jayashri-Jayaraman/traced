spring.application.name=backend

# H2 file-based database (persists to ./data/traced.mv.db)
spring.datasource.url=jdbc:h2:file:./data/traced;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console for local inspection: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# JWT signing secret (dev only) and token lifetime
app.jwt.secret=change-this-dev-secret-please-replace-with-a-real-256-bit-key-value
app.jwt.expiration-ms=86400000

# Frontend dev server origin, for CORS
app.cors.allowed-origin=http://localhost:5173
