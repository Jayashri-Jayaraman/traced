spring.application.name=backend

# H2 file-based database (persists to ./data/traced.mv.db)
spring.datasource.url=jdbc:h2:file:./data/traced;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console for local inspection: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

# JWT signing secret and token lifetime. The default below is for local dev only —
# it is never used when SPRING_PROFILES_ACTIVE=prod (see application-prod.properties,
# which requires APP_JWT_SECRET with no fallback).
app.jwt.secret=${APP_JWT_SECRET:dev-only-insecure-secret-change-me-32-bytes-minimum-1234567890}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Comma-separated list of allowed frontend origins, for CORS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Requests allowed per client IP per minute against /api/auth/**.
app.ratelimit.auth-per-minute=${APP_RATELIMIT_AUTH_PER_MINUTE:20}
