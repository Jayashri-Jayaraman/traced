# Render Blueprint — deploys the backend (Docker) and frontend (static site) as two
# free-tier services. Postgres is NOT defined here on purpose: Render's own free
# Postgres expires after a set period, so this points at an external database
# instead (Neon's free tier has no forced expiry — see the setup steps in the repo
# README / chat guidance for exact instructions).
#
# To use: Render dashboard -> New -> Blueprint -> select this repo. Render detects
# this file. Any envVar below with `sync: false` must be filled in by hand in the
# Render dashboard after the blueprint creates the services.
services:
  - type: web
    name: traced-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_JWT_SECRET
        generateValue: true
      # From your Neon (or other Postgres) project:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # The frontend service's URL once it exists, e.g. https://traced-frontend.onrender.com
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: traced-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # The backend service's URL once it exists, e.g. https://traced-backend.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
